# 로그 등에 표시할 Spring 애플리케이션 이름입니다.
spring.application.name=backend
# Render의 PORT를 사용하며 로컬에서는 기존 8080을 유지합니다.
server.port=${PORT:8080}
# 배포한 프런트엔드 출처를 쉼표로 구분합니다. 비어 있으면 동일 출처만 허용합니다.
app.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:}
# 방과 게임은 서버 메모리에서 관리하므로 DB나 외부 로그인 설정이 필요하지 않습니다.
# JSON의 소수 좌표가 정수로 잘려 다른 칸에 착수되는 일을 막습니다. 예: 2.5를 2로 받지 않습니다.
spring.jackson.deserialization.accept-float-as-int=false
# 실시간 인증 메시지에 토큰이 포함되므로 프레임의 상세 로그를 남기지 않습니다.
logging.level.org.springframework.web.socket=INFO
# 마지막 소켓 단절을 확인한 뒤 2분 동안 같은 참가자의 복귀를 기다립니다.
room.recovery.grace-period-ms=120000
# heartbeat가 45초 동안 오지 않으면 서버도 단절로 판단합니다. 클라이언트는 15초마다 보냅니다.
room.recovery.heartbeat-timeout-ms=45000
room.recovery.check-interval-ms=1000
